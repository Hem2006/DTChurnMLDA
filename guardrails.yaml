# Guardrails for retention actions. Enforced in code (app/guardrails.py); the same checks run on every /recommend and /message.
#
# The two numeric limits are POLICY numbers that only the business can set. They are null on purpose and nothing invents them:
# while a limit is null, any action it governs is NOT auto-approved - it comes back as needs_human_approval with the reason.
max_discount_pct_per_customer_per_quarter: null   # total discount % a customer may receive in one quarter (e.g. 15)
max_contacts_per_month: null                      # retention contacts per customer per month (e.g. 2)

# Fixed rules (not switchable):
#  - Vulnerable or escalated accounts are never contacted or offered anything by this system; they are escalated to a human.
#  - If the account state (vulnerable / escalated flags, contact and discount history) is not supplied, the action needs human approval.
#  - Messages may not contain pressure language (list below, matched case-insensitively, as whole words/phrases).

pressure_language:
  - act now
  - act fast
  - last chance
  - final offer
  - final notice
  - limited time
  - limited offer
  - only today
  - today only
  - hurry
  - urgent
  - urgently
  - immediately
  - before it's too late
  - before it is too late
  - don't miss out
  - do not miss out
  - you must
  - you have to
  - you will lose
  - you'll lose
  - if you leave
  - or else
  - expires soon
  - running out
  - once in a lifetime
  - guaranteed
  - risk-free
  - no obligation
